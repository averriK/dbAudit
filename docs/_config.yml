title: dbAudit
description: Geochemical certificate parser and audit pipeline (type A / type B)
remote_theme: pages-themes/modernist@v0.2.0
plugins:
  - jekyll-remote-theme
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

github:
  repository_url: https://github.com/averriK/dbAudit

# Keep the docs site self-contained when GitHub Pages is configured to build from /docs
# (Settings → Pages → Deploy from a branch → /docs).
exclude:
  - ".DS_Store"
  - "README.md"        # repo-internal index (not part of the public docs site)
  - "conventions.md"   # internal developer conventions
  - "plan.md"          # internal history/plan log
  - "tests.md"         # internal self-check notes (not part of the public docs site)
  - "installers.md"    # internal canonical installer spec (no frontmatter)
